services:
  rallly_db:
    image: docker.io/library/postgres:17.9
    restart: always
    logging:
      driver: k8s-file
      options:
        path: /var/log/rallly/postgres.log
        max-size: 25mb
    volumes:
      - /mnt/data/psqldata/:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly:
    image: docker.io/lukevella/rallly:${rallly-version}
    restart: always
    logging:
      driver: k8s-file
      options:
        path: /var/log/rallly/rallly.log
        max-size: 25mb
    depends_on:
      - rallly_db
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgres://postgres:postgres@rallly_db/db
    env_file:
      - config.env
